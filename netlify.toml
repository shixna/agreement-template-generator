[build]
  # 构建命令（如果需要）
  command = "echo 'No build step required'"
  # 发布目录（静态文件）
  publish = "public"

# Netlify Functions 配置
[functions]
  # Functions 目录
  directory = "netlify/functions"
  # 使用 esbuild 打包，并显式保留 ejs 作为外部依赖，避免动态 require 失败
  node_bundler = "esbuild"
  external_node_modules = ["ejs"]
  # 确保视图模板和静态资源被一起打包到函数目录中
  included_files = ["views/**", "public/**"]

# 重定向规则 - 将所有请求转发到 serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# 环境变量（如果需要，可以在 Netlify 控制台设置）
[build.environment]
  # 标识 Netlify 环境
  NETLIFY = "true"
  # Node.js 版本
  NODE_VERSION = "18"

